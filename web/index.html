<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>JetLag</title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; color: #888; font: 12px/1.4 monospace; }
		body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
		canvas { image-rendering: pixelated; background: #000; touch-action: none; display: block; }
		footer { margin-top: 8px; text-align: center; max-width: 90vw; }
		footer a { color: #aaa; }
	</style>
</head>
<body>
	<canvas id="screen" width="320" height="240"></canvas>
	<footer>
		JetLag by TheGrumpyGameDev. Font m5x7 by Daniel Linssen (CC0). Ported to Odin and wasm by an AI agent (Claude Code) at the author's direction.
		<a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
	</footer>
	<script src="odin.js"></script>
	<script>
	(function () {
		"use strict";
		const W = 320, H = 240;
		// Must match src/game: Command (Left, Right, Start, Mute, Board, Bomb, Shop, Buy) and Sound (Turn, Death, Coin, Bank, Bomb).
		const CMD = { LEFT: 0, RIGHT: 1, START: 2, MUTE: 3, BOARD: 4, BOMB: 5, SHOP: 6, BUY: 7, NONE: -1 };
		// Must match game.Board_Status (Idle, Loading, Ready, Failed).
		const BOARD = { LOADING: 1, READY: 2, FAILED: 3 };
		// LootLocker online top scores. This is the game's public client key, not a secret. LootLocker no longer has
		// separate staging and live data, so this one key (dev: true) is the live board. Every page that hosts
		// the game (Pages, itch's html-classic.itch.zone) must be on the console's CORS Allowlist.
		const LL = {
			domain: "https://wwx9jy8c.api.lootlocker.com",
			key: "dev_1beaf08c7c604e1da5d423227a0930a8",
			dev: true,
			version: "1.0.0",
			board: "jetlag_score",
			count: 10,
		};
		const SOUND_FILES = ["sfx/turn.wav", "sfx/death.wav", "sfx/coin.wav", "sfx/bank.wav", "sfx/bomb.wav"];
		const KEY_SLOTS = ["jetlag.high", "jetlag.bank", "jetlag.muted", "jetlag.bombs"];
		const NAME_LEN = 16; // game.NAME_LEN

		const screen = document.getElementById("screen");
		const ctx = screen.getContext("2d");
		ctx.imageSmoothingEnabled = false;
		const memory = new odin.WasmMemoryInterface();
		let ex = null; // memory.exports once the wasm is up

		function storeGet(slot) {
			try { return Number(localStorage.getItem(KEY_SLOTS[slot])) || 0; } catch (e) { return 0; }
		}
		function storeSet(slot, value) {
			try { localStorage.setItem(KEY_SLOTS[slot], String(value)); } catch (e) { /* private mode */ }
		}

		// ---- online scores ----
		function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
		function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
		function pick(k, make) {
			let v = lsGet(k);
			if (!v) { v = make(); lsSet(k, v); }
			return v;
		}
		const playerId = pick("jetlag.id", () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join(""));
		const playerName = pick("jetlag.name", () => "Player-" + String(1000 + Math.floor(Math.random() * 9000)));

		// Writes text into the wasm scratch buffer (printable ASCII only) and returns its length.
		function putName(text) {
			const clean = String(text).replace(/[^\x20-\x7e]/g, "?").slice(0, NAME_LEN);
			const bytes = new Uint8Array(memory.memory.buffer, ex.platform_scratch_ptr(), NAME_LEN);
			for (let i = 0; i < clean.length; i++) bytes[i] = clean.charCodeAt(i);
			return clean.length;
		}

		async function llCall(method, path, token, body) {
			const headers = { "Content-Type": "application/json" };
			if (token) headers["x-session-token"] = token;
			const r = await fetch(LL.domain + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
			if (!r.ok) throw new Error(path + " " + r.status);
			return r.json();
		}

		let sessionToken = null, sessionPlayer = null, sessionPending = null;
		function session() {
			if (sessionToken) return Promise.resolve(sessionToken);
			if (!sessionPending) {
				sessionPending = (async () => {
					const s = await llCall("POST", "/game/v2/session/guest", null, {
						game_key: LL.key, game_version: LL.version, development_mode: LL.dev, player_identifier: playerId,
					});
					if (s.player_name !== playerName) await llCall("PATCH", "/game/player/name", s.session_token, { name: playerName });
					sessionPlayer = String(s.player_id);
					sessionToken = s.session_token;
					return sessionToken;
				})().finally(() => { sessionPending = null; });
			}
			return sessionPending;
		}
		// A request with a session; a stale session (the token expires) is replaced once.
		async function withSession(fn) {
			try { return await fn(await session()); } catch (e) {
				sessionToken = null;
				return await fn(await session());
			}
		}

		async function loadBoard() {
			try {
				const list = await withSession(t => llCall("GET", "/game/leaderboards/" + LL.board + "/list?count=" + LL.count, t));
				ex.platform_board_begin();
				for (const row of list.items || []) {
					const n = putName(row.player && row.player.name ? row.player.name : "?");
					ex.platform_board_add(Math.min(Number(row.score) || 0, 2147483647), n);
				}
				ex.platform_board_status(BOARD.READY);
			} catch (e) {
				ex.platform_board_status(BOARD.FAILED);
			}
		}
		async function submitScore(score) {
			try {
				await withSession(t => llCall("POST", "/game/leaderboards/" + LL.board + "/submit", t, { member_id: sessionPlayer, score }));
			} catch (e) { /* the score just does not go up; the game plays on */ }
			loadBoard();
		}

		function fit() {
			let s = Math.min(window.innerWidth / W, (window.innerHeight - 40) / H);
			s = s >= 1 ? Math.floor(s) : Math.max(s, 0.5);
			screen.style.width = Math.round(W * s) + "px";
			screen.style.height = Math.round(H * s) + "px";
		}
		window.addEventListener("resize", fit);
		fit();

		// ---- sound ----
		let audio = null;
		const buffers = [];
		function unlock() {
			if (audio) { if (audio.state === "suspended") audio.resume(); return; }
			try {
				audio = new (window.AudioContext || window.webkitAudioContext)();
			} catch (e) { return; }
			SOUND_FILES.forEach((path, i) => {
				fetch(path).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b)).then(d => { buffers[i] = d; }).catch(() => {});
			});
		}
		function play(id) {
			if (!audio || !buffers[id]) return;
			const src = audio.createBufferSource();
			const gain = audio.createGain();
			gain.gain.value = 0.4;
			src.buffer = buffers[id];
			src.connect(gain).connect(audio.destination);
			src.start();
		}

		// ---- input ----
		function send(cmd) { if (ex) ex.platform_command(cmd); }
		const KEYS = {
			ArrowLeft: CMD.LEFT, KeyA: CMD.LEFT, ArrowRight: CMD.RIGHT, KeyD: CMD.RIGHT,
			KeyZ: CMD.START, Space: CMD.START, Enter: CMD.START, KeyM: CMD.MUTE, KeyB: CMD.BOARD,
			KeyS: CMD.SHOP, Digit1: CMD.BUY, Numpad1: CMD.BUY,
		};
		window.addEventListener("keydown", e => {
			if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
			let cmd = KEYS[e.code];
			if (cmd === undefined) return;
			// In a run Z and Space drop a bomb; between runs they fly.
			if (cmd === CMD.START && (e.code === "KeyZ" || e.code === "Space") && ex && ex.platform_in_play()) cmd = CMD.BOMB;
			e.preventDefault();
			unlock();
			send(cmd);
		});
		const touches = new Set();
		screen.addEventListener("pointerdown", e => {
			e.preventDefault();
			unlock();
			if (!ex) return;
			const another = touches.size > 0; // a second finger down while the first is still held
			touches.add(e.pointerId);
			const r = screen.getBoundingClientRect();
			if (!ex.platform_in_play()) {
				const y = (e.clientY - r.top) / r.height;
				if (y < 0.2) send(CMD.BOARD);
				else if (y < 0.4) send(CMD.SHOP);
				else send(ex.platform_in_shop() ? (y > 0.6 ? CMD.BUY : CMD.NONE) : CMD.START);
				return;
			}
			if (another) { send(CMD.BOMB); return; }
			send(e.clientX - r.left < r.width / 2 ? CMD.LEFT : CMD.RIGHT);
		});
		const lift = e => touches.delete(e.pointerId);
		screen.addEventListener("pointerup", lift);
		screen.addEventListener("pointercancel", lift);
		let padPrev = { left: false, right: false, start: false, board: false, x: false, b: false };
		function pollPad() {
			const pads = navigator.getGamepads ? navigator.getGamepads() : [];
			for (const p of pads) {
				if (!p || p.mapping !== "standard") continue;
				const now = {
					left: p.buttons[14].pressed || p.axes[0] < -0.5,
					right: p.buttons[15].pressed || p.axes[0] > 0.5,
					start: p.buttons[0].pressed || p.buttons[9].pressed,
					board: p.buttons[3].pressed,
					x: p.buttons[2].pressed,
					b: p.buttons[1].pressed,
				};
				// X drops a bomb in a run and opens the shop between; B buys in the shop.
				if (now.x && !padPrev.x) send(ex.platform_in_play() ? CMD.BOMB : CMD.SHOP);
				if (now.b && !padPrev.b) send(CMD.BUY);
				if (now.board && !padPrev.board) send(CMD.BOARD);
				if (now.left && !padPrev.left) send(CMD.LEFT);
				if (now.right && !padPrev.right) send(CMD.RIGHT);
				if (now.start && !padPrev.start) { unlock(); send(CMD.START); }
				padPrev = now;
				return;
			}
		}

		// ---- loop ----
		let image = null, last = 0;
		function frame(t) {
			const dt = last ? (t - last) / 1000 : 0;
			last = t;
			pollPad();
			ex.platform_frame(dt);
			let id;
			while ((id = ex.platform_take_sfx()) >= 0) play(id);
			if (!image) {
				image = new ImageData(new Uint8ClampedArray(memory.memory.buffer, ex.platform_frame_ptr(), W * H * 4), W, H);
			} else if (image.data.buffer !== memory.memory.buffer) {
				image = new ImageData(new Uint8ClampedArray(memory.memory.buffer, ex.platform_frame_ptr(), W * H * 4), W, H);
			}
			ctx.putImageData(image, 0, 0);
			requestAnimationFrame(frame);
		}
		function boot() {
			if (!memory.exports || !memory.exports.platform_frame) { requestAnimationFrame(boot); return; }
			ex = memory.exports;
			ex.platform_init(Date.now());
			ex.platform_player_name(putName(playerName));
			loadBoard();
			if (location.hash === "#play") ex.platform_command(CMD.START); // QA and screenshots
			requestAnimationFrame(frame);
		}
		odin.runWasm("game.wasm", null, { env: { store_get: storeGet, store_set: storeSet, board_refresh: () => loadBoard(), board_submit: score => submitScore(score) } }, memory);
		boot();
		window.jetlag = { send, state: () => (ex ? ex.platform_in_play() : -1) }; // for QA from the console
	})();
	</script>
</body>
</html>
